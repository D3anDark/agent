[package]
name = "agent"
version = "0.1.0"
edition = "2024"

[dependencies]
crossterm = { version = "0.29", default-features = false, features = ["events", "bracketed-paste"] }
pulldown-cmark = { version = "0.13", default-features = false }
ring = "0.17"
serde_json = "1"
unicode-width = "0.2"
ureq = { version = "3", default-features = false, features = ["rustls", "socks-proxy"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
