name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { runner: macos-latest, target: aarch64-apple-darwin, asset: agent-macos-aarch64 }
          - { runner: macos-latest, target: x86_64-apple-darwin, asset: agent-macos-x86_64 }
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-musl, asset: agent-linux-x86_64 }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, asset: agent-linux-aarch64 }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml
        run: test "${GITHUB_REF_NAME#v}" = "$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup update stable && rustup default stable && rustup target add ${{ matrix.target }}
      - run: cargo test --locked
      - name: Build
        env:
          AGENT_RELEASE: "1"
        run: |
          cargo build --release --locked --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/agent ${{ matrix.asset }}
      - if: matrix.target != 'x86_64-apple-darwin'
        run: ./${{ matrix.asset }} --version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: cli/${{ matrix.asset }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" agent-* --repo "$GITHUB_REPOSITORY" --generate-notes
