name: Feature request
description: Suggest a change or a new feature.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What do you want to do that the agent cannot do now?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: How could the agent do it? A plugin can also add tools and commands.
