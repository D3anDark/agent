  button { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
  button:focus-visible { outline: 1px solid #fff; outline-offset: 4px; }

  <h1>simple af possible</h1>

  </a>
</main>
<script>
  const install = document.getElementById("install");
  const copied = install.querySelector("[role=status]");
  let hideCopied;
  install.addEventListener("click", async () => {
    await navigator.clipboard.writeText(install.querySelector("code").textContent);
    copied.textContent = "copied";
    clearTimeout(hideCopied);
    hideCopied = setTimeout(() => { copied.textContent = ""; }, 1500);
  });
</script>
